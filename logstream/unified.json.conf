# ============================================================================
# newsyslog конфиг для ротации /var/log/unified.json.log
# Разворачивается в: /etc/newsyslog.d/unified.json.conf
#
# Формат: logfilename [owner:group] mode count size when flags
#   count = 7     — хранить 7 архивов
#   size  = 50000 — ротировать при 50 МБ (в КБ)
#   when  = *     — проверять каждый час
#   flags = J     — сжимать архивы bzip2
# ============================================================================
/var/log/unified.json.log             root:wheel      644   7      50000 *     J
