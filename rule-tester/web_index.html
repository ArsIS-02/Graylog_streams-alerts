<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraylogRuleTester</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#18202b;--mut:#667085;--ln:#e2e6ee;--ac:#2f6fed;--acb:#e8f0ff;--ok:#16824a;--okb:#e3f6ec;--bad:#c62828;--badb:#fdeaea;--warn:#a96100;--warnb:#fff3dc;--side:#101828;--sidetx:#cdd5e3;--sh:0 1px 2px rgba(16,24,40,.06)}
:root[data-theme=dark]{--bg:#0e1218;--card:#171c24;--tx:#e7ebf2;--mut:#94a0b4;--ln:#2a313c;--ac:#6b9bff;--acb:#1c2a45;--ok:#4cc38a;--okb:#13291f;--bad:#ff7b72;--badb:#33181a;--warn:#e3a008;--warnb:#33290f;--side:#0a0d12;--sidetx:#b4bdcc;--sh:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1218;--card:#171c24;--tx:#e7ebf2;--mut:#94a0b4;--ln:#2a313c;--ac:#6b9bff;--acb:#1c2a45;--ok:#4cc38a;--okb:#13291f;--bad:#ff7b72;--badb:#33181a;--warn:#e3a008;--warnb:#33290f;--side:#0a0d12;--sidetx:#b4bdcc;--sh:none}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sidetx);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;color:#fff;font-weight:700;font-size:15px}.brand img{width:30px;height:30px}
.brand small{display:block;font-weight:400;color:var(--sidetx);font-size:11px}
aside a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--sidetx);text-decoration:none;cursor:pointer}
aside a:hover{background:rgba(255,255,255,.07)}aside a.on{background:var(--ac);color:#fff}
aside .sp{flex:1}aside .ver{font-size:12px;padding:8px;color:#7d8aa0}
.pill{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
.ico{width:18px;text-align:center}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;margin-right:auto}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:16px;padding:2px 10px;font-size:12px;background:var(--card);color:var(--mut);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}.chip.ok i{background:var(--ok)}.chip.bad i{background:var(--bad)}
.chip.sel{background:var(--acb);border-color:var(--ac);color:var(--ac);cursor:pointer}.chip.act{cursor:pointer}.chip.act:hover{border-color:var(--ac)}
main{padding:20px;max-width:1280px;width:100%}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:14px;margin:0 0 12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.guide{max-width:880px;line-height:1.55}
.guide h1{font-size:22px;margin:0 0 16px}
.guide h2{font-size:17px;margin:28px 0 10px;padding-top:12px;border-top:1px solid var(--ln);color:var(--tx);text-transform:none;letter-spacing:normal;font-weight:700}
.guide h2:first-child{border-top:none;padding-top:0}
.guide h3{font-size:14px;margin:18px 0 8px}
.guide p{margin:0 0 12px}
.guide p img{display:block;max-width:100%;border:1px solid var(--ln);border-radius:8px;margin:10px 0 4px}
.guide p em{display:block;color:var(--mut);font-size:13px;font-style:normal;margin-top:4px}
.guide ul,.guide ol{margin:0 0 12px;padding-left:22px}
.guide li{margin-bottom:4px}
.guide code{background:var(--acb);color:var(--ac);padding:1px 5px;border-radius:4px;font-size:.92em}
.guide pre{background:var(--side);color:#cdd5e3;padding:12px 14px;border-radius:8px;overflow:auto;margin:0 0 12px}
.guide pre code{background:none;color:inherit;padding:0}
.guide a{color:var(--ac)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;box-shadow:var(--sh)}.stat b{display:block;font-size:26px;line-height:1.2}.stat b.sm{font-size:16px;line-height:1.9}.stat span{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--ln);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--tx);text-decoration:none;display:inline-block}.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.dng{background:var(--bad);border-color:var(--bad);color:#fff}.btn.sm{padding:2px 8px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:6px 10px}textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:120px}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}label.f input,label.f select{width:100%}label.f input[type=checkbox]{width:auto;margin-right:8px}label.f:has(input[type=checkbox]) span{display:inline}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap;user-select:none}th.s{cursor:pointer}th.s:hover{color:var(--ac)}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--acb)}
.mut{color:var(--mut)}code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow:auto;max-height:440px;white-space:pre-wrap;word-break:break-word;margin:0;font-size:12px}
.badge{display:inline-flex;gap:4px;align-items:center;border-radius:6px;padding:0 8px;font-size:12px;line-height:20px;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-bad{background:var(--badb);color:var(--bad)}.b-warn{background:var(--warnb);color:var(--warn)}.b-mut{background:var(--bg);color:var(--mut);border:1px solid var(--ln)}.b-ac{background:var(--acb);color:var(--ac)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--ln);min-width:90px}.bar i{display:block}.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}.bar .y{background:var(--warn)}
.banner{border:1px solid var(--bad);background:var(--badb);color:var(--bad);border-radius:12px;padding:12px 16px;margin-bottom:16px}.banner.ok{border-color:var(--ok);background:var(--okb);color:var(--ok)}.banner.warn{border-color:var(--warn);background:var(--warnb);color:var(--warn)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--card);border-left:1px solid var(--ln);box-shadow:-8px 0 30px rgba(0,0,0,.25);overflow:auto;padding:18px;z-index:20;display:none}.drawer.on{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:18px;max-width:480px;width:100%}.modal .act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--ln);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
details{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;margin-bottom:6px}summary{cursor:pointer}
.sub{padding-left:10px;border-left:3px solid var(--ln);margin:6px 0}
#login{max-width:340px;margin:14vh auto;padding:0 16px}
.hide{display:none!important}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow:auto;padding:8px}aside .brand,aside .sp,aside .ver{display:none}aside a{white-space:nowrap}
 main{padding:12px}.top{padding:10px 12px}th.h,td.h{display:none}}
</style>
</head>
<body>
<div id="login" class="hide">
  <div class="card">
    <div class="brand" style="color:var(--tx)"><img src="/favicon.svg" alt=""><div>GraylogRuleTester<small class="mut">проверка правил Graylog</small></div></div>
    <label class="f"><span>Учётная запись</span><input id="lgname" type="text" value="admin" autocomplete="username"></label>
    <label class="f"><span>Пароль</span><input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn pri" id="pwgo" style="width:100%">Войти</button><div id="pwerr" style="color:var(--bad);margin-top:8px"></div>
  </div>
</div>
<div class="app hide" id="app">
<aside>
  <div class="brand"><img src="/favicon.svg" alt=""><div>GraylogRuleTester<small id="ver"></small></div></div>
  <a data-p="home"><span class="ico">▦</span>Сводка</a>
  <a data-p="rules"><span class="ico">≡</span>Правила</a>
  <a data-p="run"><span class="ico">▶</span>Запуск</a>
  <a data-p="results"><span class="ico">✓</span>Результаты<span class="pill hide" id="pillf"></span></a>
  <a data-p="detect"><span class="ico">⛨</span>Проверка детектов</a>
  <a data-p="coverage"><span class="ico">◎</span>Покрытие</a>
  <a data-p="quality"><span class="ico">!</span>Качество</a>
  <a data-p="settings"><span class="ico">⚙</span>Настройки</a>
  <a data-p="audit" id="navaudit"><span class="ico">☰</span>Журнал</a>
  <a data-p="guide"><span class="ico">📘</span>Руководство</a>
  <div class="sp"></div>
  <div class="ver" id="who"></div>
</aside>
<div>
  <div class="top"><h1 id="title"></h1><span id="chips" class="row" style="margin:0"></span>
    <button class="btn sm" id="theme" title="Тема">Тема</button><button class="btn sm" id="logout">Выйти</button></div>
  <main id="main"></main>
</div>
</div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="box"><b id="mt"></b><p id="mb"></p><div class="act"><button class="btn" id="mno">Отмена</button><button class="btn pri" id="myes">Подтвердить</button></div></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v)}
  for(const c of kids.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
let ROLE='',ME={};
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){showLogin();throw new Error('auth')}let d;try{d=await r.json()}catch(e){d={}}if(!r.ok)throw new Error(d.error||('ошибка '+r.status));return d}
function ask(title,text,danger,okText){return new Promise(res=>{$('#mt').textContent=title;$('#mb').textContent=text;const y=$('#myes');y.textContent=okText||'Подтвердить';y.className='btn '+(danger?'dng':'pri');
  $('#mno').classList.remove('hide');$('#modal').classList.add('on');const done=v=>{$('#modal').classList.remove('on');res(v)};y.onclick=()=>done(true);$('#mno').onclick=()=>done(false)})}
function note(text,title){return new Promise(res=>{$('#mt').textContent=title||'Сообщение';$('#mb').textContent=text;const y=$('#myes');y.textContent='Понятно';y.className='btn pri';$('#mno').classList.add('hide');
  $('#modal').classList.add('on');y.onclick=()=>{$('#modal').classList.remove('on');res()}})}
const isAdmin=()=>ROLE==='admin';
const isRunner=()=>ROLE==='runner';
const canRun=()=>ROLE==='admin'||ROLE==='runner';
const OK=['ПРОШЛО','СОБЫТИЕ ЕСТЬ','ЧИСТО','ИЗМЕРЕНО'];
function statusBadge(s){if(!s)return h('span',{class:'badge b-mut'},'нет данных');
  if(OK.includes(s))return h('span',{class:'badge b-ok'},'✓ '+s.toLowerCase());if(s==='ПРОПУЩЕНО')return h('span',{class:'badge b-warn'},'– пропущено');return h('span',{class:'badge b-bad'},'✕ '+s.toLowerCase())}
function fmtTime(s){return s?s.replace('T',' ').slice(0,16):''}
function ago(ts){if(!ts)return'';const m=Math.round((Date.now()/1000-ts)/60);return m<1?'только что':m<90?m+' мин назад':Math.round(m/60)+' ч назад'}
function stackBar(st){const t=st.total||1;return h('div',{class:'bar',title:`прошло ${st.passed}, провалов ${st.failed}, пропущено ${st.skipped}`},
  h('i',{class:'g',style:`width:${st.passed/t*100}%`}),h('i',{class:'r',style:`width:${st.failed/t*100}%`}),h('i',{class:'y',style:`width:${st.skipped/t*100}%`}))}
function sortable(rows,key,dir){return rows.slice().sort((a,b)=>{let x=a[key],y=b[key];if(x==null)x='';if(y==null)y='';if(typeof x==='number'&&typeof y==='number')return(x-y)*dir;return String(x).localeCompare(String(y),'ru')*dir})}

/* ---------- тема ---------- */
function applyTheme(){const t=localStorage.getItem('rt_theme')||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);$('#theme').textContent={auto:'Тема: авто',light:'Тема: светлая',dark:'Тема: тёмная'}[t]}
$('#theme').onclick=()=>{const o=['auto','light','dark'];const t=localStorage.getItem('rt_theme')||'auto';localStorage.setItem('rt_theme',o[(o.indexOf(t)+1)%3]);applyTheme()};
applyTheme();

/* ---------- вход, каркас ---------- */
function showLogin(){$('#app').classList.add('hide');$('#login').classList.remove('hide')}
$('#pwgo').onclick=async()=>{try{await api('/api/login',{login:$('#lgname').value,password:$('#pw').value});$('#login').classList.add('hide');boot()}catch(e){$('#pwerr').textContent=e.message}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#pwgo').click()};
$('#logout').onclick=async()=>{try{await api('/api/logout',{})}catch(e){}showLogin()};
const PAGES={home:['Сводка',pHome],rules:['Правила',pRules],run:['Запуск',pRun],results:['Результаты',pResults],detect:['Проверка детектов',pDetect],coverage:['Покрытие',pCoverage],quality:['Качество запросов',pQuality],settings:['Настройки',pSettings],audit:['Журнал действий',pAudit],guide:['Руководство администратора',pGuide]};
let CUR='',TIMER=null;
function route(){clearTimeout(TIMER);const[rawp,qs]=(location.hash.slice(2)||'home').split('?');const sp=new URLSearchParams(qs||'');
  let p=rawp;if(p==='art'||p==='method'){if(!sp.get('kind'))sp.set('kind',p);p='detect'} // старые ссылки #/art и #/method
  const page=PAGES[p]?p:'home';CUR=page;
  document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.p===page));$('#title').textContent=PAGES[page][0];
  const m=$('#main');m.textContent='';m.append(h('div',{class:'mut'},'Загрузка…'));
  Promise.resolve(PAGES[page][1](sp,m)).catch(e=>{if(e.message!=='auth'){m.textContent='';m.append(h('div',{class:'banner'},e.message))}})}
window.addEventListener('hashchange',route);
document.querySelectorAll('aside a').forEach(a=>a.onclick=()=>{location.hash='#/'+a.dataset.p});
async function chips(){try{const s=await api('/api/summary');const hh=s.health;const box=$('#chips');box.textContent='';
  const c=(ok,t)=>h('span',{class:'chip '+(ok?'ok':'bad')},h('i'),t);
  box.append(c(hh.graylog.ok,hh.graylog.ok?hh.graylog.text:'Graylog недоступен'),c(hh.stream.ok,'Поток: '+hh.stream.text),c(hh.gelf.ok,'GELF: '+(hh.gelf.ok?'задан':'не задан')));
  const f=s.known_failed;const pl=$('#pillf');pl.textContent=f;pl.classList.toggle('hide',!f)}catch(e){}}
async function boot(){ME=await api('/api/status');ROLE=ME.role;$('#ver').textContent='версия '+ME.version;
  $('#who').textContent='Роль: '+(ROLE==='admin'?'администратор':ROLE==='runner'?'запуск':'наблюдатель')+' · v'+ME.version;
  $('#navaudit').classList.toggle('hide',!isAdmin());$('#app').classList.remove('hide');chips();route()}

/* ---------- сводка ---------- */
async function pHome(q,m){const s=await api('/api/summary');const tr=await api('/api/trend');m.textContent='';
  if(s.note)m.append(h('div',{class:'banner'},s.note));
  const L=s.last;
  if(L&&L.stats.failed>0)m.append(h('div',{class:'banner'},h('b',{},`Последний прогон (${fmtTime(L.created)}): провалов ${L.stats.failed} из ${L.stats.total}. `),h('a',{href:'#/results?file='+encodeURIComponent(L.file),style:'color:inherit'},'Открыть отчёт')));
  else if(L)m.append(h('div',{class:'banner ok'},`Последний прогон (${fmtTime(L.created)}): все правила прошли (${L.stats.passed} из ${L.stats.total}, пропущено ${L.stats.skipped}).`));
  else m.append(h('div',{class:'banner',style:'border-color:var(--ln);background:var(--card);color:var(--mut)'},'Прогонов ещё не было. Нажмите «Запустить проверку» ниже.'));
  if(s.missed_schedule&&s.missed_schedule.length){
    m.append(h('div',{class:'banner warn'},h('b',{},'Плановый запуск пропущен: '),
      h('div',{},...s.missed_schedule.map(x=>h('div',{style:'margin-top:4px'},
        `${x.mode_ru} — ${x.hours_ago==null?'ещё не выполнялся ни разу':'последний раз '+Math.round(x.hours_ago/24*10)/10+' дн. назад'}`))),
      h('div',{class:'mut',style:'margin-top:6px;font-size:12px'},'Расписание задано в «Настройках», но режим давно не запускался — обычно значит, что контейнер был выключен или перезапущен дольше суток. Проверьте, запущен ли контейнер постоянно, или запустите вручную ниже.')));
  }
  if(s.field_drift&&s.field_drift.some(d=>d.count>1)){const top=s.field_drift.filter(d=>d.count>1).slice(0,5);
    m.append(h('div',{class:'banner warn'},h('b',{},'Возможен дрейф схемы данных: '),
      h('div',{},...top.map(d=>h('div',{style:'margin-top:4px'},`${d.field} — пропало/изменилось в ${d.count} ${d.count===1?'правиле':'правилах'} (${d.platforms.join(', ')})`))),
      h('div',{class:'mut',style:'margin-top:6px;font-size:12px'},'Одно поле задело сразу несколько правил — похоже, на источнике поменялся пайплайн или маппинг, а не правила сломались. Проверьте настоящие образцы ниже в провалах.')))}
  const stat=(v,t,c)=>h('div',{class:'stat'},h('b',{style:c?`color:var(--${c})`:'',class:(v&&v.nodeType)?'sm':''},v),h('span',{},t));
  m.append(h('div',{class:'grid'},stat(s.rules,'правил в Graylog'),stat(s.known_passed,'прошли по последним результатам','ok'),stat(s.known_failed,'провалов','bad'),stat(s.flagged,'правил с замечаниями','warn'),
    stat(h('span',{class:'sm'},s.next?fmtTime(s.next.at):'—'),'ближайший запуск'+(s.next?': '+s.next.mode.toLowerCase():''))));
  const act=h('div',{class:'row'});
  if(canRun()){act.append(h('button',{class:'btn pri',onclick:async()=>{try{await api('/api/run',{mode:'queries'});location.hash='#/run'}catch(e){note(e.message)}}},'Запустить проверку по всем правилам'),
    h('button',{class:'btn',onclick:()=>location.hash='#/run'},'Другие режимы'))}
  m.append(h('div',{class:'card'},h('h2',{},'Действия'),act));
  const full=tr.items.filter(i=>i.full);
  const card=h('div',{class:'card'},h('h2',{},'Доля прошедших правил по полным прогонам'));
  card.append(full.length?trendChart(full):h('div',{class:'mut'},'Появится после двух полных прогонов (по всем правилам).'));m.append(card);
  if(s.fails.length){const t=h('table',{},h('tr',{},h('th',{},'Правило'),h('th',{},'Результат'),h('th',{class:'h'},'Подробности')));

    h('div',{class:'mut'},s.retention_days?`Хранить отчёты и сценарии replay ${s.retention_days} дн. (настраивается в «Настройках» → «Хранение»; выполняется автоматически раз в сутки).`:'Срок хранения не задан (бессрочно) — настройте его в «Настройках» → «Хранение», чтобы включить и ручную, и автоматическую очистку.')),
    isAdmin()&&s.retention_days?h('button',{class:'btn dng',onclick:async()=>{
      if(!await ask('Очистить старые файлы?',`Будут удалены отчёты и сценарии replay старше ${s.retention_days} дн. Журнал, история и настройки не затрагиваются.`,true))return;
      try{const r=await api('/api/cleanup',{});await note(`Удалено файлов: ${r.removed}.`);pAudit(q,m)}catch(e){note(e.message)}}},'Очистить сейчас'):''));
  m.append(bk,cl,h('div',{class:'card',style:'overflow:auto'},d.audit.length?t:'Пусто'))}

async function pGuide(q,m){const d=await api('/api/guide');m.textContent='';
  const box=h('div',{class:'card guide'});box.innerHTML=d.html;m.append(box)}
