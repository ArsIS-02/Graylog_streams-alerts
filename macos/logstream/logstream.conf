# Настройки сборщика unified log (применяются после: sudo launchctl kickstart -k system/com.user.logstream)
LOGFILE=/var/log/unified.json.log
MAX_MB=50          # размер текущего файла до ротации
KEEP=72            # сколько сжатых архивов хранить (~50 МБ каждый до сжатия, ~3 МБ после)
LEVEL=default      # default | info | debug  (info/debug многократно увеличивают объём)

# Фильтр: всё, кроме заведомого шума. Вход/выход, блокировка экрана, sudo, ssh, TCC, USB, установки,
# запуск приложений (runningboardd «Now tracking process»), ядро, антивирус — сохраняются.
PREDICATE='NOT (process IN {"airportd","trustd","CoreServicesUIAgent","bluetoothd","locationd","MTLCompilerService","dasd","mDNSResponder","gamepolicyd","WallpaperAerialsExtension","searchpartyd","symptomsd","filecoordinationd","cfprefsd","mds","mds_stores","mdworker_shared","WeatherWidget","ContinuityCaptureAgent","duetexpertd","BiomeAgent","biomesyncd","mediaanalysisd","spotlightknowledged","intelligenceplatformd","modelmanagerd","chronod","rapportd","wifip2pd"}) AND NOT (process == "runningboardd" AND NOT (eventMessage CONTAINS "Now tracking process")) AND NOT (process == "loginwindow" AND eventMessage CONTAINS "Failed to get cache main folder") AND NOT (process == "nxnode.bin" AND eventMessage BEGINSWITH "VCPRateControlSession")'
