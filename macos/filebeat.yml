# =========================== Inputs ===========================
filebeat.inputs:

  # ============================================================
  # 1. ТОЛЬКО КРИТИЧЕСКИЕ СОБЫТИЯ из unified logging
  # ============================================================
  - type: filestream
    id: unified-json
    enabled: true
    paths:
      - /var/log/unified.json.log
    fields:
      log_type: macos_unified
    fields_under_root: true
    # Фильтр по ключевым словам (можно расширять)
    include_lines:
      - 'AirDrop'
      - 'sharingd'
      - 'USB'
      - 'enumerated'
      - 'sudo'
      - 'incorrect'
      - 'password'
      - 'TCC'
      - 'Sandbox'
      - 'kernel panic'
      - 'diskarbitrationd'
      - 'AMPDeviceDiscovery'
    processors:
      # 1. Переименовываем ключ timestamp в исходной JSON-строке,
      #    чтобы Graylog не принимал его за время сообщения
      - script:
          lang: javascript
          id: rename_unified_timestamp
          source: |
            function process(event) {
              var msg = event.Get("message");
              if (msg) {
                event.Put("message", msg.replace('"timestamp":"', '"event_timestamp":"'));
              }
            }
      # 2. Разбираем JSON, как и раньше
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
      # 3. Время события из event_timestamp ("2026-10-20 22:25:12.141137+0500") в @timestamp
      - timestamp:
          field: event_timestamp
          layouts:
            - '2006-01-02 15:04:05.999999-0700'
          test:
            - '2026-10-20 22:25:12.141137+0500'

  # ============================================================
  # 2. USB-события из wifi.log (подключение/отключение)
  # ============================================================
  - type: filestream
    id: macos-wifi-usb
    enabled: true
    paths:
      - /var/log/wifi.log
    fields:
      log_type: macos_wifi_usb
    fields_under_root: true
    include_lines:
      - 'Usb Host Notification'
      - 'USBDeviceInserted'
      - 'USBDeviceRemoved'

  # ============================================================
  # 3. Результаты osquery (обязательно)
  # ============================================================
  - type: filestream
    id: osquery-results
    enabled: true
    paths:
      - /var/log/osquery/osqueryd.results.log
    fields:
      log_type: macos_osquery
    fields_under_root: true
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
  - type: filestream
    id: macos-commands
    enabled: true
    paths:
      - /Users/igor/.local/log/commands.log
    fields:
      log_type: macos_commands
    fields_under_root: true
    exclude_lines:
     - '^.*\|\s*cd /usr/local/filebeat'
     - '^.*\|\s*sudo \./filebeat.*'
     - '^.*\|\s*cat .*filebeat.yml'
     - '^.*\|\s*grep .*'
     - '^.*\|\s*cat -vet.*'
  # ============================================================
  # ОТКЛЮЧЕНЫ (закомментированы или удалены):
  # - macos-firewall (включить, если нужны логи брандмауэра)
  # - macos-crash (только для отладки)
  # - macos-system (system.log – устарел)
  # - macos-install (install.log – редко нужен)
  # - macos-apps (очень шумно)

# =========================== Processors ===========================
processors:
  - add_host_metadata: ~

# =========================== Output ===========================
output.logstash:
  hosts: ["192.168.1.137:5046"]   # новый порт
  timeout: 30s
  ttl: 5s
  pipelining: 1
  compression_level: 3
  bulk_max_size: 256              # ещё меньше для снижения нагрузки

# =========================== Metadata ===========================
tags: ["macos", "prod", "essential"]

# =========================== Logging ===========================
logging.level: info
logging.to_files: true
logging.files:
  path: /usr/local/filebeat/logs
  name: filebeat.log
  keepfiles: 7
  permissions: 0644
