{
   "exclude_paths": {
      "launch_agents": [
         "/Library/LaunchAgents/com.apple*.plist",
         "/Users/%/Library/LaunchAgents/com.apple*.plist"
      ],
      "launch_daemons": [
         "/Library/LaunchDaemons/com.apple*.plist"
      ]
   },
   "file_paths": {
      "launch_agents": [
         "/Library/LaunchAgents/%.plist",
         "/Users/%/Library/LaunchAgents/%.plist"
      ],
      "launch_daemons": [
         "/Library/LaunchDaemons/%.plist"
      ],
      "sudoers": [
         "/etc/sudoers"
      ]
   },
   "options": {
      "disable_audit": false,
      "disable_events": false,
      "enable_file_events": true,
      "host_identifier": "hostname",
      "schedule_splay_percent": 10
   },
   "schedule": {
      "app_entitlements": {
         "interval": 3600,
         "query": "SELECT a.name, a.bundle_identifier, s.identifier, s.team_identifier, s.authority, s.signed FROM apps a JOIN signature s ON s.path = a.path;"
      },
      "dns_resolvers": {
         "interval": 300,
         "query": "SELECT * FROM dns_resolvers;"
      },
      "es_process_events": {
         "interval": 120,
         "query": "SELECT cdhash, child_pid, cmdline, cmdline_count, codesigning_flags, cwd, egid, env_count, euid, event_type, exit_code, gid, global_seq_num, original_parent, parent, parent_pidversion, path, pid, pidversion, platform_binary, responsible_pid, responsible_pidversion, seq_num, session_id, signing_id, team_id, time, uid, username, version FROM es_process_events;"
      },
      "file_events": {
         "interval": 60,
         "query": "SELECT * FROM file_events;",
         "snapshot": false
      },
      "gatekeeper_status": {
         "interval": 3600,
         "query": "SELECT * FROM gatekeeper;"
      },
      "launchd_items": {
         "interval": 3600,
         "query": "SELECT * FROM launchd WHERE name LIKE 'com.%.plist';"
      },
      "listening_ports": {
         "interval": 600,
         "query": "SELECT p.pid, p.name, lp.port, lp.address, lp.protocol FROM listening_ports lp JOIN processes p ON (lp.pid = p.pid);"
      },
      "mdfind_suspicious": {
         "interval": 1800,
         "query": "SELECT path FROM mdfind WHERE query = 'kMDItemFSName == \"*.dmg\"' LIMIT 10;"
      },
      "password_policy": {
         "interval": 3600,
         "query": "SELECT * FROM password_policy;"
      },
      "running_processes": {
         "interval": 600,
         "query": "SELECT pid, name, path, state FROM processes WHERE state = 'R';"
      },
      "shell_history": {
         "interval": 3600,
         "query": "SELECT uid, command FROM shell_history WHERE uid IN (SELECT uid FROM users WHERE shell NOT LIKE '%/false');"
      },
      "sip_status": {
         "interval": 3600,
         "query": "SELECT config_flag, enabled, enabled_nvram FROM sip_config;"
      },
      "sudo_commands": {
         "interval": 60,
         "query": "SELECT pid, parent, path, cmdline, username, uid, cwd, time FROM es_process_events WHERE (path LIKE '%/sudo' OR cmdline LIKE 'sudo %') AND event_type = 'exec';",
         "snapshot": false
      },
      "sudoers_changes": {
         "interval": 60,
         "query": "SELECT target_path, action, md5, sha256, time FROM file_events WHERE target_path = '/etc/sudoers';",
         "snapshot": false
      },
      "suspicious_processes": {
         "interval": 60,
         "query": "SELECT pid, path, cmdline, username, uid, cwd, time FROM es_process_events WHERE (path LIKE '%/nc' OR path LIKE '%/ncat' OR path LIKE '%/netcat' OR path LIKE '%/socat' OR path LIKE '%/python' OR path LIKE '%/python3' OR path LIKE '%/bash' OR path LIKE '%/sh' OR path LIKE '%/zsh' OR path LIKE '%/perl' OR path LIKE '%/ruby' OR path LIKE '%/openssl' OR path LIKE '%/osascript' OR path LIKE '%/curl') AND (cmdline LIKE '% -l %' OR cmdline LIKE '% -e %' OR cmdline LIKE '% -c %' OR cmdline LIKE '%reverse%' OR cmdline LIKE '%miner%' OR cmdline LIKE '%/dev/tcp/%' OR cmdline LIKE '%| sh%' OR cmdline LIKE '%|sh%' OR cmdline LIKE '%base64%') AND event_type = 'exec';",
         "snapshot": false
      },
      "system_info": {
         "interval": 86400,
         "query": "SELECT hostname, cpu_brand, physical_memory, hardware_vendor, hardware_model FROM system_info;"
      },
      "system_profiler_info": {
         "interval": 7200,
         "query": "SELECT data_type, value FROM system_profiler WHERE data_type = 'SPDisplaysDataType';"
      },
      "tcc_permissions": {
         "interval": 3600,
         "query": "SELECT service, client, auth_value FROM tcc_permissions;"
      },
      "trusted_certs": {
         "interval": 7200,
         "query": "SELECT * FROM darwin_certificate_trust_settings;"
      },
      "unified_errors": {
         "interval": 600,
         "query": "SELECT timestamp, process, sender, subsystem, category, level, message FROM unified_log WHERE level IN ('error', 'fault') AND timestamp > (SELECT unix_time - 600 FROM time) AND max_rows = 200;"
      },
      "usb_devices": {
         "interval": 60,
         "query": "SELECT vendor, model, model_id, vendor_id, serial, usb_address FROM usb_devices;",
         "snapshot": true
      },
      "wifi_history": {
         "interval": 3600,
         "query": "SELECT * FROM wifi_networks;"
      }
   }
}
