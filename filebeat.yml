# =========================== Inputs ===========================
filebeat.inputs:

  # ============================================================
  # 1. ТОЛЬКО КРИТИЧЕСКИЕ СОБЫТИЯ из unified logging
  # ============================================================
  # ВАЖНО: include_lines — это грубый фильтр по подстроке.
  # Он не умеет исключать. Если добавишь паттерн, который
  # часто встречается у шумных процессов (Kaspersky, Sandbox),
  # поток резко вырастет. Проверяй через:
  #   grep -c "паттерн" /var/log/unified.json.log*
  # ============================================================
  - type: filestream
    id: unified-json
    enabled: true
    paths:
      - /var/log/unified.json.log
    fields:
      log_type: macos_unified
    fields_under_root: true
    include_lines:
      # События передачи файлов
      - 'AirDrop'
      # Доступ к камере/микрофону/сенсорам (TCC = Transparency Consent Control)
      - 'TCC'
      # USB-устройства (точный паттерн, в отличие от широкого "USB")
      - 'hostNotificationUSB'
      # Паники ядра и сбои оборудования
      - 'kernel panic'
      # USB-устройства Apple (в unified logs)
      - 'AMPDeviceDiscovery'
      # Защита системы
      - 'SIP'
      - 'FileVault'
      - 'Gatekeeper'
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

  # ============================================================
  # 2. USB-события из wifi.log (подключение/отключение)
  # ============================================================
  # Здесь источник — /var/log/wifi.log, куда macOS пишет
  # уведомления о USB через "Usb Host Notification".
  # Эти строки дают точную информацию о том, что подключено.
  - type: filestream
    id: macos-wifi-usb
    enabled: true
    paths:
      - /var/log/wifi.log
    fields:
      log_type: macos_wifi_usb
    fields_under_root: true
    include_lines:
      - 'Usb Host Notification'
      - 'USBDeviceInserted'
      - 'USBDeviceRemoved'

  # ============================================================
  # 3. Результаты osquery (структурированные снимки состояния)
  # ============================================================
  - type: filestream
    id: osquery-results
    enabled: true
    paths:
      - /var/log/osquery/osqueryd.results.log
    fields:
      log_type: macos_osquery
    fields_under_root: true
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

  # ============================================================
  # ОТКЛЮЧЕНЫ (закомментированы или удалены):
  # - macos-firewall (включить, если нужны логи брандмауэра)
  # - macos-crash (только для отладки)
  # - macos-commands (только если нужно логировать команды)
  # - macos-system (system.log – устарел)
  # - macos-install (install.log – редко нужен)
  # - macos-apps (очень шумно)
  # ============================================================

# =========================== Processors ===========================
processors:
  - add_host_metadata: ~

# =========================== Output ===========================
# ЗАМЕНИТЬ на IP:PORT своего Graylog Beats Input!
output.logstash:
  hosts: ["YOUR GRAYLOG-SERVER IP:PORT"]
  timeout: 30s
  ttl: 5s
  pipelining: 1
  compression_level: 3
  bulk_max_size: 256

# =========================== Metadata ===========================
tags: ["macos", "prod", "essential"]

# =========================== Logging ===========================
logging.level: info
logging.to_files: true
logging.files:
  path: /usr/local/filebeat/logs
  name: filebeat.log
  keepfiles: 7
  permissions: 0644
