{
  "options": {
    "host_identifier": "hostname",
    "schedule_splay_percent": 10,
    "enable_file_events": true,
    "disable_events": false,
    "disable_audit": false
  },
  "schedule": {
    "system_info": {
      "query": "SELECT hostname, cpu_brand, physical_memory, hardware_vendor, hardware_model FROM system_info;",
      "interval": 86400
    },
    "listening_ports": {
      "query": "SELECT p.pid, p.name, lp.port, lp.address, lp.protocol FROM listening_ports lp JOIN processes p ON (lp.pid = p.pid);",
      "interval": 600
    },
    "running_processes": {
      "query": "SELECT pid, name, path, state FROM processes WHERE state = 'R';",
      "interval": 600
    },
    "tcc_permissions": {
      "query": "SELECT service, client, auth_value FROM tcc_permissions;",
      "interval": 3600
    },
    "gatekeeper_status": {
      "query": "SELECT * FROM gatekeeper;",
      "interval": 3600
    },
    "sip_status": {
      "query": "SELECT sip_config FROM system_info;",
      "interval": 3600
    },
    "trusted_certs": {
      "query": "SELECT * FROM darwin_certificate_trust_settings;",
      "interval": 7200
    },
    "password_policy": {
      "query": "SELECT * FROM password_policy;",
      "interval": 3600
    },
    "shell_history": {
      "query": "SELECT uid, command FROM shell_history WHERE uid IN (SELECT uid FROM users WHERE shell NOT LIKE '%/false');",
      "interval": 3600
    },
    "mdfind_suspicious": {
      "query": "SELECT path, filename FROM mdfind WHERE query = 'kMDItemFSName == \"*.dmg\"' LIMIT 10;",
      "interval": 1800
    },
    "unified_errors": {
      "query": "SELECT timestamp, sender, message FROM unified_log WHERE message_type IN ('Error', 'Fault') AND timestamp > datetime('now', '-30 minutes') LIMIT 50;",
      "interval": 600
    },
    "es_process_events": {
      "query": "SELECT * FROM es_process_events;",
      "interval": 120
    },
    "app_entitlements": {
      "query": "SELECT path, identifier, entitlements FROM signature WHERE entitlements != '';",
      "interval": 3600
    },
    "launchd_items": {
      "query": "SELECT * FROM launchd WHERE name LIKE 'com.%.plist';",
      "interval": 3600
    },
    "system_profiler_info": {
      "query": "SELECT * FROM system_profiler WHERE section = 'SPDisplaysDataType';",
      "interval": 7200
    },
    "wifi_history": {
      "query": "SELECT * FROM wifi_networks;",
      "interval": 3600
    },
    "dns_resolvers": {
      "query": "SELECT * FROM dns_resolvers;",
      "interval": 300
    },
    "sudo_commands": {
      "query": "SELECT pid, parent, path, cmdline, uid, gid, cwd, time FROM process_events WHERE cmdline LIKE 'sudo %' OR cmdline LIKE '%sudo %';",
      "interval": 60,
      "snapshot": false
    },
    "suspicious_processes": {
      "query": "SELECT pid, name, path, cmdline, uid, cwd, time FROM process_events WHERE (name IN ('nc','ncat','netcat','python','python3','bash','sh','perl','ruby','openssl') AND (cmdline LIKE '% -l %' OR cmdline LIKE '% -e %' OR cmdline LIKE '% -c %' OR cmdline LIKE '%reverse%' OR cmdline LIKE '%miner%' OR cmdline LIKE '%crypto%')) OR cmdline LIKE '%nc -l%' OR cmdline LIKE '%ncat -l%' OR cmdline LIKE '%/bin/sh -i%' OR cmdline LIKE '%python -c%';",
      "interval": 60,
      "snapshot": false
    },
    "usb_devices": {
      "query": "SELECT vendor, model, model_id, vendor_id, serial, usb_address FROM usb_devices;",
      "interval": 60,
      "snapshot": true
    },
    "sudoers_changes": {
      "query": "SELECT target_path, action, md5, sha256, time FROM file_events WHERE target_path = '/etc/sudoers';",
      "interval": 60,
      "snapshot": false
    },
    "file_events": {
      "query": "SELECT * FROM file_events;",
      "interval": 60,
      "snapshot": false
    }
  },
  "file_paths": {
    "launch_daemons": [
      "/Library/LaunchDaemons/%.plist"
    ],
    "launch_agents": [
      "/Library/LaunchAgents/%.plist",
      "/Users/%/Library/LaunchAgents/%.plist"
    ],
    "sudoers": [
      "/etc/sudoers"
    ]
  },
  "exclude_paths": {
    "launch_daemons": [
      "/Library/LaunchDaemons/com.apple*.plist"
    ],
    "launch_agents": [
      "/Library/LaunchAgents/com.apple*.plist",
      "/Users/%/Library/LaunchAgents/com.apple*.plist"
    ]
  }
}
