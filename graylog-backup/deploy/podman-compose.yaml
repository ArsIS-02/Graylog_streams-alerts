services:
  graylog-backup:
    build:
      context: ../..
      dockerfile: graylog-backup/Containerfile
    image: localhost/graylog-backup:latest
    container_name: graylog-backup
    restart: unless-stopped
    env_file: ./graylog-backup.env
    # environment:  # добавьте нужные строки, если раскомментировали соответствующие volumes ниже
    #   GB_SERVER_CONF: /mnt/host/server.conf
    #   GB_MONGOD_CONF: /mnt/host/mongod.conf
    #   GB_OPENSEARCH_CONF: /mnt/host/opensearch.yml
    #   GB_PLUGIN_DIR: /mnt/host/plugins
    ports:
      - "8086:8080"
    volumes:
      - graylog-backup-data:/data:Z
      # Для полного бэкапа (аварийное восстановление) — раскомментируйте и подставьте
      # настоящие пути на хосте; install.sh для quadlet делает то же самое автоматически
      # по HOST_SERVER_CONF/HOST_MONGOD_CONF/HOST_OPENSEARCH_CONF/HOST_PLUGIN_DIR из
      # graylog-backup.env, здесь — вручную:
      # - /etc/graylog/server/server.conf:/mnt/host/server.conf:ro,Z
      # - /usr/share/graylog-server/plugin:/mnt/host/plugins:ro,Z
      # mongod.conf и opensearch.yml обычно лежат на ДРУГИХ хостах, чем graylog-server —
      # раскомментируйте только там, где реально запущен этот контейнер:
      # - /etc/mongod.conf:/mnt/host/mongod.conf:ro,Z
      # - /etc/opensearch/opensearch.yml:/mnt/host/opensearch.yml:ro,Z
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
volumes:
  graylog-backup-data:
