<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraylogBackup</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#18202b;--mut:#667085;--ln:#e2e6ee;--ac:#2f6fed;--acb:#e8f0ff;--ok:#16824a;--okb:#e3f6ec;--bad:#c62828;--badb:#fdeaea;--warn:#a96100;--warnb:#fff3dc;--side:#101828;--sidetx:#cdd5e3;--sh:0 1px 2px rgba(16,24,40,.06)}
:root[data-theme=dark]{--bg:#0e1218;--card:#171c24;--tx:#e7ebf2;--mut:#94a0b4;--ln:#2a313c;--ac:#6b9bff;--acb:#1c2a45;--ok:#4cc38a;--okb:#13291f;--bad:#ff7b72;--badb:#33181a;--warn:#e3a008;--warnb:#33290f;--side:#0a0d12;--sidetx:#b4bdcc;--sh:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1218;--card:#171c24;--tx:#e7ebf2;--mut:#94a0b4;--ln:#2a313c;--ac:#6b9bff;--acb:#1c2a45;--ok:#4cc38a;--okb:#13291f;--bad:#ff7b72;--badb:#33181a;--warn:#e3a008;--warnb:#33290f;--side:#0a0d12;--sidetx:#b4bdcc;--sh:none}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sidetx);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;color:#fff;font-weight:700;font-size:15px}.brand img{width:30px;height:30px}
.brand small{display:block;font-weight:400;color:var(--sidetx);font-size:11px}
aside a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--sidetx);text-decoration:none;cursor:pointer}
aside a:hover{background:rgba(255,255,255,.07)}aside a.on{background:var(--ac);color:#fff}
aside .sp{flex:1}aside .ver{font-size:12px;padding:8px;color:#7d8aa0}
.ico{width:18px;text-align:center}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;margin-right:auto}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:16px;padding:2px 10px;font-size:12px;background:var(--card);color:var(--mut);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}.chip.ok i{background:var(--ok)}.chip.bad i{background:var(--bad)}
main{padding:20px;max-width:1100px;width:100%}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:14px;margin:0 0 12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;box-shadow:var(--sh)}.stat b{display:block;font-size:26px;line-height:1.2}.stat b.sm{font-size:16px;line-height:1.9}.stat span{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--ln);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--tx);text-decoration:none;display:inline-block}.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.dng{background:var(--bad);border-color:var(--bad);color:#fff}.btn.sm{padding:2px 8px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:6px 10px}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}label.f input{width:100%}label.f input[type=checkbox]{width:auto;margin-right:8px}label.f:has(input[type=checkbox]) span{display:inline}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
.mut{color:var(--mut)}code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow:auto;max-height:360px;white-space:pre-wrap;word-break:break-word;margin:0;font-size:12px}
.badge{display:inline-flex;gap:4px;align-items:center;border-radius:6px;padding:0 8px;font-size:12px;line-height:20px;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-bad{background:var(--badb);color:var(--bad)}.b-warn{background:var(--warnb);color:var(--warn)}.b-mut{background:var(--bg);color:var(--mut);border:1px solid var(--ln)}
.banner{border:1px solid var(--bad);background:var(--badb);color:var(--bad);border-radius:12px;padding:12px 16px;margin-bottom:16px}.banner.ok{border-color:var(--ok);background:var(--okb);color:var(--ok)}.banner.warn{border-color:var(--warn);background:var(--warnb);color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:18px;max-width:480px;width:100%}.modal .act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#login{max-width:340px;margin:14vh auto;padding:0 16px}
.hide{display:none!important}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow:auto;padding:8px}aside .brand,aside .sp,aside .ver{display:none}aside a{white-space:nowrap}
 main{padding:12px}.top{padding:10px 12px}th.h,td.h{display:none}}
</style>
</head>
<body>
<div id="login" class="hide">
  <div class="card">
    <div class="brand" style="color:var(--tx)"><img src="/favicon.svg" alt=""><div>GraylogBackup<small class="mut">резервная копия конфигурации Graylog</small></div></div>
    <label class="f"><span>Учётная запись</span><input id="lgname" type="text" value="admin" autocomplete="username"></label>
    <label class="f"><span>Пароль</span><input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn pri" id="pwgo" style="width:100%">Войти</button><div id="pwerr" style="color:var(--bad);margin-top:8px"></div>
  </div>
</div>
<div class="app hide" id="app">
<aside>
  <div class="brand"><img src="/favicon.svg" alt=""><div>GraylogBackup<small id="ver"></small></div></div>
  <a data-p="home"><span class="ico">▦</span>Сводка</a>
  <a data-p="backups"><span class="ico">🗄</span>Бэкапы</a>
  <a data-p="settings"><span class="ico">⚙</span>Настройки</a>
  <a data-p="audit"><span class="ico">☰</span>Журнал</a>
  <div class="sp"></div>
  <div class="ver" id="who"></div>
</aside>
<div>
  <div class="top"><h1 id="title"></h1><span id="chips" class="row" style="margin:0"></span>
    <button class="btn sm" id="theme" title="Тема">Тема</button><button class="btn sm" id="logout">Выйти</button></div>
  <main id="main"></main>
</div>
</div>
<div class="modal" id="modal"><div class="box"><b id="mt"></b><p id="mb"></p><div class="act"><button class="btn" id="mno">Отмена</button><button class="btn pri" id="myes">Подтвердить</button></div></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v)}
  for(const c of kids.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
let ROLE='',ME={};
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){showLogin();throw new Error('auth')}let d;try{d=await r.json()}catch(e){d={}}if(!r.ok)throw new Error(d.error||('ошибка '+r.status));return d}
function ask(title,text,danger,okText){return new Promise(res=>{$('#mt').textContent=title;$('#mb').textContent=text;const y=$('#myes');y.textContent=okText||'Подтвердить';y.className='btn '+(danger?'dng':'pri');
  $('#mno').classList.remove('hide');$('#modal').classList.add('on');const done=v=>{$('#modal').classList.remove('on');res(v)};y.onclick=()=>done(true);$('#mno').onclick=()=>done(false)})}
function note(text,title){return new Promise(res=>{$('#mt').textContent=title||'Сообщение';$('#mb').textContent=text;const y=$('#myes');y.textContent='Понятно';y.className='btn pri';$('#mno').classList.add('hide');
  $('#modal').classList.add('on');y.onclick=()=>{$('#modal').classList.remove('on');res()}})}
const isAdmin=()=>ROLE==='admin';
function fmtTime(s){return s?s.replace('T',' ').slice(0,16):''}
function fmtBytes(n){if(n==null)return'—';if(n<1024)return n+' Б';if(n<1048576)return(n/1024).toFixed(1)+' КБ';return(n/1048576).toFixed(1)+' МБ'}
function stepBadge(st){if(!st)return h('span',{class:'badge b-mut'},'нет данных');
  const s=st.status;if(s==='ok')return h('span',{class:'badge b-ok',title:st.duration_s?st.duration_s+' с':''},'✓ ok');
  if(s==='partial')return h('span',{class:'badge b-warn',title:JSON.stringify(st.failed||{})},'± частично');
  if(s==='skipped')return h('span',{class:'badge b-mut',title:st.reason||''},'– пропущено');
  return h('span',{class:'badge b-bad',title:st.reason||JSON.stringify(st.failed||{})},'✕ ошибка')}

/* ---------- тема ---------- */
function applyTheme(){const t=localStorage.getItem('gb_theme')||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);$('#theme').textContent={auto:'Тема: авто',light:'Тема: светлая',dark:'Тема: тёмная'}[t]}
$('#theme').onclick=()=>{const o=['auto','light','dark'];const t=localStorage.getItem('gb_theme')||'auto';localStorage.setItem('gb_theme',o[(o.indexOf(t)+1)%3]);applyTheme()};
applyTheme();

/* ---------- вход, каркас ---------- */
function showLogin(){$('#app').classList.add('hide');$('#login').classList.remove('hide')}
$('#pwgo').onclick=async()=>{try{await api('/api/login',{login:$('#lgname').value,password:$('#pw').value});$('#login').classList.add('hide');boot()}catch(e){$('#pwerr').textContent=e.message}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#pwgo').click()};
$('#logout').onclick=async()=>{try{await api('/api/logout',{})}catch(e){}showLogin()};
const PAGES={home:['Сводка',pHome],backups:['Бэкапы',pBackups],settings:['Настройки',pSettings],audit:['Журнал действий',pAudit]};
let CUR='';
function route(){const[rawp]=(location.hash.slice(2)||'home').split('?');const page=PAGES[rawp]?rawp:'home';CUR=page;
  document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.p===page));$('#title').textContent=PAGES[page][0];
  const m=$('#main');m.textContent='';m.append(h('div',{class:'mut'},'Загрузка…'));
  Promise.resolve(PAGES[page][1](m)).catch(e=>{if(e.message!=='auth'){m.textContent='';m.append(h('div',{class:'banner'},e.message))}})}
window.addEventListener('hashchange',route);
document.querySelectorAll('aside a').forEach(a=>a.onclick=()=>{location.hash='#/'+a.dataset.p});
async function chips(){try{const s=await api('/api/summary');const box=$('#chips');box.textContent='';
  const c=(ok,t)=>h('span',{class:'chip '+(ok?'ok':'bad')},h('i'),t);
  box.append(c(s.graylog_url_set,'Graylog'+(s.graylog_url_set?'':': не настроен')),c(s.mongo_set,'MongoDB'+(s.mongo_set?'':': не настроен')),c(s.server_conf_set,'server.conf'+(s.server_conf_set?'':': не смонтирован')),c(s.opensearch_set,'OpenSearch'+(s.opensearch_set?'':': не настроен (необязательно)')))}catch(e){}}
async function boot(){ME=await api('/api/status');ROLE=ME.role;$('#ver').textContent='версия '+ME.version;
  $('#who').textContent='Администратор · v'+ME.version;$('#app').classList.remove('hide');chips();route()}

/* ---------- запуск бэкапа (общая кнопка) ---------- */
async function runNow(after){
  try{await api('/api/run',{})}catch(e){note(e.message);return}
  await pollJob(after)}
async function pollJob(after){
  for(;;){const d=await api('/api/job');const j=d.job;if(!j)return;
    if(j.status!=='идёт'){if(after)after(j);return}
    await new Promise(r=>setTimeout(r,1500))}}

/* ---------- сводка ---------- */
async function pHome(m){const s=await api('/api/summary');m.textContent='';
  const L=s.last;
  if(!L)m.append(h('div',{class:'banner',style:'border-color:var(--ln);background:var(--card);color:var(--mut)'},'Резервных копий ещё не было. Нажмите «Бэкап сейчас» ниже.'));
  else{const steps=L.steps||{};const bad=Object.values(steps).some(v=>v&&v.status==='error');const part=Object.values(steps).some(v=>v&&v.status==='partial');
    m.append(h('div',{class:'banner '+(bad?'':part?'warn':'ok')},h('b',{},`Последняя копия: ${fmtTime(L.mtime)}, ${fmtBytes(L.bytes)}. `),
      h('span',{},bad?'есть ошибки в шагах — см. «Бэкапы».':part?'частично — см. «Бэкапы».':'все шаги прошли.'),
      L.graylog_version?h('span',{class:'mut'},` Graylog ${L.graylog_version}.`):''))}
  m.append(h('div',{class:'grid'},
    h('div',{class:'stat'},h('b',{},String(s.count)),h('span',{},'архивов хранится')),
    h('div',{class:'stat'},h('b',{class:'sm'},s.retention_days||'бессрочно'),h('span',{},'срок хранения, дн.')),
    h('div',{class:'stat'},h('b',{class:'sm'},s.schedule?(s.schedule_enabled?s.schedule:s.schedule+' (выкл.)'):'не задано'),h('span',{},'расписание'))));
  const act=h('div',{class:'row'},h('button',{class:'btn pri',onclick:async()=>{act.firstChild.disabled=true;await runNow(()=>{location.hash='#/backups'})}},'Бэкап сейчас'),
    h('button',{class:'btn',onclick:()=>location.hash='#/backups'},'Все архивы'));
  m.append(h('div',{class:'card'},h('h2',{},'Действия'),act));
  chips()}

/* ---------- бэкапы ---------- */
async function pBackups(m){const d=await api('/api/backups');m.textContent='';
  const bar=h('div',{class:'card'});
  const run=h('button',{class:'btn pri',onclick:async()=>{run.disabled=true;prog.classList.remove('hide');prog.textContent='Выполняется…';
    await runNow(j=>{run.disabled=false;prog.classList.add('hide');pBackups(m)})}},'Бэкап сейчас');
  const prog=h('div',{class:'mut hide',style:'margin-top:8px'});
  bar.append(h('div',{class:'row'},run),prog);m.append(bar);
  const t=h('table',{},h('tr',{},h('th',{},'Время'),h('th',{},'Размер'),h('th',{},'Конфигурация'),h('th',{},'MongoDB'),h('th',{},'server.conf'),h('th',{},'mongod.conf'),h('th',{},'Плагины'),h('th',{},'OpenSearch'),h('th',{},'opensearch.yml'),h('th',{},'')));
  d.backups.forEach(r=>{const steps=r.steps||{};
    t.append(h('tr',{},h('td',{},fmtTime(r.mtime)),h('td',{},fmtBytes(r.bytes)),
      h('td',{},stepBadge(steps.config)),h('td',{},stepBadge(steps.mongo)),h('td',{},stepBadge(steps.server_conf)),h('td',{},stepBadge(steps.mongod_conf)),h('td',{},stepBadge(steps.plugins)),h('td',{},stepBadge(steps.search)),h('td',{},stepBadge(steps.opensearch_conf)),
      h('td',{},h('div',{class:'row',style:'margin:0'},
        h('a',{class:'btn sm',href:'/api/backup/download?file='+encodeURIComponent(r.file)},'Скачать'),
        h('button',{class:'btn sm dng',onclick:async()=>{if(!await ask('Удалить архив?',r.file+' — отменить нельзя.',true))return;
          try{await api('/api/backup/delete',{file:r.file});pBackups(m)}catch(e){note(e.message)}}},'Удалить')))));});
  m.append(h('div',{class:'card',style:'overflow:auto'},d.backups.length?t:h('div',{class:'mut'},'Архивов пока нет.')));
  if(d.backups.length)m.append(h('div',{class:'mut',style:'font-size:12px'},'Восстановление (mongorestore) — только из консоли, см. главу 18: это редкая и необратимая операция, в веб-интерфейс она намеренно не вынесена.'))}

/* ---------- настройки ---------- */
async function pSettings(m){const s=(await api('/api/settings')).settings;m.textContent='';
  const inputs={};
  const f=(key,label,type,ph)=>{const i=h('input',{type:type||'text',value:type==='password'?'':s[key]||'',placeholder:ph||''});inputs[key]=i;return h('label',{class:'f'},h('span',{},label),i)};
  m.append(h('div',{class:'card'},h('h2',{},'Graylog'),
    f('graylog_url','Адрес Graylog REST','text','https://graylog.apps.monitoring.test'),
    f('graylog_token','Токен API',s.token_set?'password':'text',s.token_set?'не менять — оставьте пустым':'токен только для чтения; можно использовать тот же, что у rule-tester')));
  m.append(h('div',{class:'card'},h('h2',{},'MongoDB'),
    f('mongo_uri','Строка подключения','text','mongodb://host.containers.internal:27017/graylog'),
    h('div',{class:'mut',style:'font-size:12px;margin-top:-4px'},'Нужен mongodump внутри образа (есть в Containerfile). Без этого поля шаг пропускается.')));
  m.append(h('div',{class:'card'},h('h2',{},'Файлы конфигурации с хоста'),
    h('div',{class:'mut',style:'font-size:12px'},'Пути задаются только переменными окружения (GB_SERVER_CONF, GB_MONGOD_CONF, GB_OPENSEARCH_CONF, GB_PLUGIN_DIR) — это файлы/каталог с хоста, монтируются в контейнер только для чтения при установке (см. главу 18, HOST_SERVER_CONF/HOST_MONGOD_CONF/HOST_OPENSEARCH_CONF/HOST_PLUGIN_DIR в install.sh). Здесь не редактируются.'),
    h('div',{class:'row',style:'margin-top:8px;flex-wrap:wrap'},
      h('span',{class:'chip '+(s.server_conf_set?'ok':'bad')},h('i'),'server.conf'+(s.server_conf_set?'':': не смонтирован')),
      h('span',{class:'chip '+(s.mongod_conf_set?'ok':'bad')},h('i'),'mongod.conf'+(s.mongod_conf_set?'':': не смонтирован (необязательно)')),
      h('span',{class:'chip '+(s.opensearch_conf_set?'ok':'bad')},h('i'),'opensearch.yml'+(s.opensearch_conf_set?'':': не смонтирован (необязательно)')),
      h('span',{class:'chip '+(s.plugin_dir_set?'ok':'bad')},h('i'),'Плагины'+(s.plugin_dir_set?'':': не смонтированы (необязательно)')))));
  m.append(h('div',{class:'card'},h('h2',{},'OpenSearch / Elasticsearch'),
    f('opensearch_url','Адрес (REST)','text','http://host.containers.internal:9200'),
    h('div',{class:'mut',style:'font-size:12px;margin-top:-4px'},'Необязательно: сохраняются только шаблоны индексов и настройки кластера, не сами логи. Пусто — шаг пропускается.')));
  const insecure=h('input',{type:'checkbox',checked:s.insecure==='1'});
  m.append(h('div',{class:'card'},h('h2',{},'Сертификат'),
    f('ca_file','Файл CA (путь внутри контейнера)','text','/certs/ca.pem'),
    h('label',{class:'f'},insecure,' не проверять сертификат (только лаборатория)')));
  const schedOn=h('input',{type:'checkbox',checked:s.schedule_enabled!=='0'});
  m.append(h('div',{class:'card'},h('h2',{},'Расписание и хранение'),
    f('schedule','Время ежедневного автозапуска (ЧЧ:ММ, пояс контейнера)','text','03:30'),
    h('label',{class:'f'},schedOn,' запускать по расписанию'),
    f('retention_days','Хранить последних архивов, дней','text','пусто — бессрочно')));
  const save=h('button',{class:'btn pri',onclick:async()=>{
    const body={};for(const k in inputs)body[k]=inputs[k].value;body.insecure=insecure.checked?'1':'0';body.schedule_enabled=schedOn.checked?'1':'0';
    try{await api('/api/settings/save',body);await note('Настройки сохранены.');pSettings(m)}catch(e){note(e.message)}}},'Сохранить');
  const check=h('button',{class:'btn',onclick:async()=>{check.disabled=true;out.textContent='Проверяю…';
    try{const r=await api('/api/settings/check',{});out.textContent=r.text||'(пусто)'}catch(e){out.textContent=e.message}check.disabled=false}},'Проверить соединение');
  const out=h('pre',{style:'margin-top:10px'},'');
  m.append(h('div',{class:'card'},h('div',{class:'row'},save,check),out))}

/* ---------- журнал ---------- */
async function pAudit(m){const d=await api('/api/audit');m.textContent='';
  const t=h('table',{},h('tr',{},h('th',{},'Время'),h('th',{},'Роль'),h('th',{},'Адрес'),h('th',{},'Действие'),h('th',{},'Подробности')));
  d.audit.forEach(r=>t.append(h('tr',{},h('td',{},fmtTime(r.t)),h('td',{},r.role),h('td',{},r.ip),h('td',{},r.action),h('td',{class:'mut'},r.detail))));
  m.append(h('div',{class:'card',style:'overflow:auto'},d.audit.length?t:h('div',{class:'mut'},'Пусто')))}

api('/api/status').then(d=>{ME=d;ROLE=d.role;boot()}).catch(()=>showLogin());
</script>
